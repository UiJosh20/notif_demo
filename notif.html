<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mobile & Desktop Push App</title>
  <style>
    :root {
      --primary: #16a34a;
      --bg: #f4f7f6;
      --card-bg: #ffffff;
      --text: #111827;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 400px;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      text-align: center;
    }

    h1 { font-size: 1.5rem; margin-top: 0; }
    p { color: #4b5563; font-size: 0.95rem; line-height: 1.4; }

    .btn {
      background: #0f172a;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 1rem;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      margin-top: 12px;
      font-weight: 600;
    }

    /* Responsive Custom Soft Banner */
    #custom-banner {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 380px;
      background: #ffffff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      z-index: 10000;
      border: 1px solid #e1e4e8;
      text-align: left;
    }

    #custom-banner h3 { margin: 0 0 6px 0; font-size: 1.1rem; }
    #custom-banner p { margin: 0 0 16px 0; font-size: 0.85rem; }

    .banner-actions { display: flex; gap: 8px; }
    .btn-claim { background: var(--primary); color: white; border: none; padding: 10px; border-radius: 8px; flex: 1; font-weight: bold; cursor: pointer; }
    .btn-skip { background: #f1f5f9; color: #64748b; border: none; padding: 10px; border-radius: 8px; cursor: pointer; }
    
    .admin-link { display: block; margin-top: 20px; color: #2563eb; text-decoration: none; font-size: 14px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Prize Portal</h1>
    <p>Test system-level notifications for mobile and desktop devices.</p>
    <button class="btn" id="test-system-notif">Test Direct OS Notification</button>
    <a href="admin.html" target="_blank" class="admin-link">Open Broadcast Dashboard ↗</a>
  </div>

  <!-- Soft Custom Prompt with Your Wording -->
  <div id="custom-banner">
    <h3>🎉 You are a winner!</h3>
    <p>Click the button to claim your price and enable live system notifications.</p>
    <div class="banner-actions">
      <button class="btn-claim" id="claim-btn">Claim Price</button>
      <button class="btn-skip" id="skip-btn">No Thanks</button>
    </div>
  </div>

  <script>
    // 1. Register the Service Worker for Background/OS level delivery
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log("Service Worker Registered Successfully!"))
        .catch(err => console.error("Service Worker Registration Failed", err));
    }

    const banner = document.getElementById("custom-banner");
    
    setTimeout(() => {
      if (Notification.permission === "default") {
        banner.style.display = "block";
      }
    }, 1000);

    async function requestOSPermission() {
      banner.style.display = "none";
      const permission = await Notification.requestPermission();
      
      if (permission === "granted") {
        const reg = await navigator.serviceWorker.ready;
        reg.showNotification("🏆 Prize Claimed!", {
          body: "Your system notifications are now active on this device.",
          icon: "https://via.placeholder.com/128"
        });
      } else {
        alert("Permission denied. System banners cannot be displayed.");
      }
    }

    document.getElementById("claim-btn").addEventListener("click", requestOSPermission);
    document.getElementById("skip-btn").addEventListener("click", requestOSPermission);

    // Direct manual test button
    document.getElementById("test-system-notif").addEventListener("click", async () => {
      if (Notification.permission === "granted") {
        const reg = await navigator.serviceWorker.ready;
        reg.showNotification("⚡ Test System Alert", {
          body: "This is what a real system-level phone/desktop banner looks like!",
          icon: "https://via.placeholder.com/128"
        });
      } else {
        requestOSPermission();
      }
    });

    // Listen for broadcasts from admin panel to push real system notifications
    const channel = new BroadcastChannel("web_app_push_channel");
    channel.onmessage = async (event) => {
      if (Notification.permission === "granted") {
        const reg = await navigator.serviceWorker.ready;
        reg.showNotification(event.data.title, {
          body: event.data.message,
          icon: "https://via.placeholder.com/128"
        });
      }
    };
  </script>
</body>
</html>
